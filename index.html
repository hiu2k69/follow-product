<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>到货台账 · Goods Arrival Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg-a:#0B0F1A; --bg-b:#111827;
    --surface:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.08); --border-soft:rgba(255,255,255,.05);
    --ink:#F1F5F9; --ink-soft:#94A3B8; --ink-faint:#64748B;
    --primary:#6366F1; --primary-2:#818CF8; --primary-soft:rgba(99,102,241,.18);
    --success:#10B981; --success-soft:rgba(16,185,129,.15);
    --danger:#F43F5E; --danger-soft:rgba(244,63,94,.15);
    --warning:#F59E0B; --warning-soft:rgba(245,158,11,.15);
    --glow:0 0 40px rgba(99,102,241,.25);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px -10px rgba(0,0,0,.5);
    --shadow-lg:0 25px 50px -12px rgba(0,0,0,.6);
    --radius:18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; padding-bottom:calc(100px + var(--safe-bottom)); color:var(--ink);
    font-family:'Noto Sans SC','Inter',sans-serif;
    background:
      radial-gradient(ellipse 120% 80% at 50% -20%, rgba(99,102,241,.18), transparent),
      radial-gradient(ellipse 80% 50% at 100% 50%, rgba(16,185,129,.06), transparent),
      linear-gradient(180deg, #0B0F1A 0%, #0F172A 40%, #111827 100%);
  }
  body.lang-en{ font-family:'Inter','Noto Sans SC',sans-serif; }
  body.lang-en [lang-zh]{ display:none !important; }
  [lang-en]{ display:none; }
  body.lang-en [lang-en]{ display:inline; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  .container-app{ max-width:980px; margin:0 auto; padding:0 18px; }

  /* ===== Hero ===== */
  .hero{ padding:26px 0 10px; }
  .hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-icon{
    width:52px; height:52px; border-radius:16px; flex:none;
    background:linear-gradient(135deg, #6366F1, #A855F7);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--glow), 0 8px 20px rgba(99,102,241,.35);
    position:relative;
  }
  .brand-icon::after{
    content:''; position:absolute; inset:-2px; border-radius:18px;
    background:linear-gradient(135deg, rgba(99,102,241,.5), rgba(168,85,247,.3));
    z-index:-1; filter:blur(8px); opacity:.7;
  }
  .brand-icon svg{ width:26px; height:26px; }
  .brand-title{ font-size:1.42rem; font-weight:800; line-height:1.15; letter-spacing:-.02em; }
  .brand-sub{ color:var(--ink-soft); font-size:.8rem; margin-top:4px; display:flex; align-items:center; gap:7px; }
  .brand-sub .dot{ width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 8px var(--success); animation:pulseDot 1.8s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }

  .hero-actions{ display:flex; align-items:center; gap:8px; }
  .lang-toggle{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:3px; display:inline-flex; backdrop-filter:blur(12px); }
  .lang-toggle button{
    border:none; background:transparent; color:var(--ink-soft);
    padding:8px 14px; border-radius:9px; font-size:.78rem; font-weight:700; cursor:pointer; transition:.2s;
  }
  .lang-toggle button.active{ background:var(--primary); color:#fff; box-shadow:0 0 16px rgba(99,102,241,.4); }
  .icon-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:12px;
    width:42px; height:42px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); backdrop-filter:blur(12px); transition:.2s; cursor:pointer;
  }
  .icon-btn:hover{ color:var(--primary-2); border-color:var(--primary); }
  .icon-btn.spinning svg{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .icon-btn svg{ width:18px; height:18px; }

  /* ===== Summary ===== */
  .summary-strip{ display:grid; grid-template-columns:1.25fr 1fr 1fr 1fr; gap:12px; margin-top:22px; }
  .sum-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; backdrop-filter:blur(16px); position:relative; overflow:hidden;
    transition:transform .2s, box-shadow .2s;
  }
  .sum-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .sum-card .val{ font-size:1.5rem; font-weight:700; font-family:'Sora',monospace; letter-spacing:-.03em; }
  .sum-card .lbl{ font-size:.72rem; color:var(--ink-soft); margin-top:4px; font-weight:600; }
  .sum-card.accent-red .val{ color:#FB7185; }
  .sum-card.accent-amber .val{ color:#FBBF24; }
  .sum-card .mini-icon{
    position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .sum-card .mini-icon svg{ width:15px; height:15px; }
  .sum-card.plain .mini-icon{ background:var(--primary-soft); color:var(--primary-2); }
  .sum-card.accent-red .mini-icon{ background:var(--danger-soft); color:#FB7185; }
  .sum-card.accent-amber .mini-icon{ background:var(--warning-soft); color:#FBBF24; }

  .ring-card{ display:flex; align-items:center; gap:14px; }
  .ring{
    --pct:0; width:56px; height:56px; border-radius:50%; flex:none;
    background:conic-gradient(#10B981 calc(var(--pct)*1%), rgba(255,255,255,.08) 0);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px rgba(16,185,129,.2);
    transition:background 1s cubic-bezier(.16,1,.3,1);
  }
  .ring::before{ content:""; width:42px; height:42px; border-radius:50%; background:#0F172A; }

  /* ===== Controls ===== */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:20px; }
  .select-wrap{ position:relative; }
  .select-item{
    appearance:none; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 36px 11px 14px; font-size:.85rem; font-weight:700; color:var(--ink);
    min-width:180px; backdrop-filter:blur(12px); cursor:pointer; transition:.2s;
  }
  .select-item:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .select-wrap::after{
    content:""; position:absolute; right:14px; top:50%; width:7px; height:7px;
    border-right:2px solid var(--ink-faint); border-bottom:2px solid var(--ink-faint);
    transform:translateY(-65%) rotate(45deg); pointer-events:none;
  }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    border-radius:999px; padding:8px 14px; font-size:.76rem; font-weight:700;
    display:inline-flex; align-items:center; gap:6px; transition:.2s; cursor:pointer; backdrop-filter:blur(8px);
  }
  .chip:hover{ border-color:var(--primary); color:var(--primary-2); }
  .chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 0 16px rgba(99,102,241,.35); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; }
  .chip[data-f="late"] .dot{ background:#F43F5E; }
  .chip[data-f="ontime"] .dot{ background:#6366F1; }
  .chip[data-f="early"] .dot{ background:#10B981; }
  .chip[data-f="pending"] .dot{ background:#F59E0B; }

  .search-wrap{ position:relative; margin-left:auto; }
  .search-input{
    max-width:190px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 14px 11px 36px; font-size:.84rem; color:var(--ink); backdrop-filter:blur(12px); transition:.2s;
  }
  .search-input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .search-input::placeholder{ color:var(--ink-faint); }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); }

  /* ===== List ===== */
  #listArea{ min-height:200px; }
  .item-group{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-top:14px; overflow:hidden; backdrop-filter:blur(16px);
    animation:riseIn .45s ease both;
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }

  .item-group-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; background:rgba(255,255,255,.03); border-bottom:1px solid var(--border-soft);
  }
  .item-group-head .left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .item-badge{
    width:38px; height:38px; border-radius:11px; flex:none;
    background:var(--primary-soft); color:var(--primary-2);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.9rem;
  }
  .item-group-head .name{ font-weight:700; font-size:.97rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-group-head .meta{ font-size:.74rem; color:var(--ink-soft); margin-top:2px; }
  .item-group-head .meta .warn{ color:#FB7185; font-weight:700; }
  .badge-count{ background:rgba(255,255,255,.12); color:#fff; font-size:.72rem; font-weight:700; border-radius:999px; padding:5px 11px; }

  .carton-row{
    display:flex; align-items:center; gap:12px; padding:13px 18px;
    border-bottom:1px solid var(--border-soft); transition:background .15s;
  }
  .carton-row:last-child{ border-bottom:none; }
  .carton-row:hover{ background:rgba(255,255,255,.03); }
  .carton-label{ width:84px; flex:none; font-size:.82rem; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .manual-dot{ width:7px; height:7px; border-radius:50%; background:var(--primary-2); box-shadow:0 0 6px var(--primary-2); }
  .carton-dates{ flex:1; display:flex; gap:18px; flex-wrap:wrap; min-width:0; }
  .date-block{ min-width:92px; }
  .date-block .k{ font-size:.62rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  .date-block .v{ font-family:'JetBrains Mono',monospace; font-size:.84rem; margin-top:2px; }
  .diff-block{ width:56px; flex:none; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.92rem; }
  .diff-block.late{ color:#FB7185; } .diff-block.early{ color:#34D399; }
  .diff-block.ontime{ color:#818CF8; } .diff-block.pending{ color:var(--ink-faint); }

  .status-pill{
    flex:none; font-size:.71rem; font-weight:700; padding:6px 12px; border-radius:999px;
    min-width:84px; text-align:center; display:inline-flex; align-items:center; gap:5px; justify-content:center;
  }
  .status-pill svg{ width:12px; height:12px; }
  .status-pill.late{ color:#FB7185; background:var(--danger-soft); }
  .status-pill.early{ color:#34D399; background:var(--success-soft); }
  .status-pill.ontime{ color:#818CF8; background:var(--primary-soft); }
  .status-pill.pending{ color:#FBBF24; background:var(--warning-soft); }

  /* Mark received button */
  .btn-receive{
    flex:none; height:32px; padding:0 12px; border-radius:9px; border:1px solid rgba(16,185,129,.4);
    background:rgba(16,185,129,.12); color:#34D399; font-size:.72rem; font-weight:700;
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; transition:.2s;
  }
  .btn-receive:hover{ background:rgba(16,185,129,.25); box-shadow:0 0 12px rgba(16,185,129,.25); }
  .btn-receive svg{ width:13px; height:13px; }

  .row-actions{ display:flex; align-items:center; gap:6px; flex:none; }
  .row-delete{
    width:32px; height:32px; border-radius:9px; border:none; background:transparent;
    color:var(--ink-faint); display:flex; align-items:center; justify-content:center; transition:.15s; cursor:pointer;
  }
  .row-delete:hover{ background:var(--danger-soft); color:#FB7185; }
  .row-delete svg{ width:15px; height:15px; }

  .empty-state, .error-state{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:52px 20px; text-align:center; color:var(--ink-soft); margin-top:14px; backdrop-filter:blur(16px);
  }
  .empty-state .glyph, .error-state .glyph{ font-size:2.6rem; margin-bottom:14px; }
  .error-state{ color:#FB7185; }
  .empty-state .cta-row{ display:flex; gap:10px; justify-content:center; margin-top:20px; }

  /* ===== Futuristic Loading ===== */
  .futuristic-loader{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:70px 20px; margin-top:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    backdrop-filter:blur(16px);
  }
  .loader-core{
    width:80px; height:80px; position:relative; margin-bottom:22px;
  }
  .loader-ring{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--primary);
    border-right-color:rgba(99,102,241,.3);
    animation:orbit 1.4s linear infinite;
  }
  .loader-ring:nth-child(2){
    inset:10px; border-top-color:#A855F7; border-right-color:rgba(168,85,247,.3);
    animation-duration:1.1s; animation-direction:reverse;
  }
  .loader-ring:nth-child(3){
    inset:20px; border-top-color:#10B981; border-right-color:rgba(16,185,129,.3);
    animation-duration:.85s;
  }
  .loader-center{
    position:absolute; top:50%; left:50%; width:14px; height:14px;
    margin:-7px 0 0 -7px; border-radius:50%;
    background:linear-gradient(135deg,#6366F1,#A855F7);
    box-shadow:0 0 16px #6366F1, 0 0 30px rgba(168,85,247,.5);
    animation:pulseCore 1.5s ease-in-out infinite;
  }
  @keyframes orbit{ to{ transform:rotate(360deg); } }
  @keyframes pulseCore{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.3); opacity:.7; } }
  .loader-text{
    font-size:.85rem; font-weight:600; color:var(--ink-soft);
    letter-spacing:.04em; animation:fadeText 1.6s ease-in-out infinite;
  }
  @keyframes fadeText{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  footer.page-footer{ color:var(--ink-faint); font-size:.72rem; text-align:center; margin-top:28px; line-height:1.6; padding-bottom:10px; }

  /* FAB */
  .fab{
    position:fixed; right:20px; bottom:calc(24px + var(--safe-bottom));
    width:60px; height:60px; border-radius:20px; border:none;
    background:linear-gradient(135deg, #6366F1, #A855F7);
    color:#fff; box-shadow:0 12px 30px -6px rgba(99,102,241,.5), 0 0 20px rgba(168,85,247,.3);
    display:none; align-items:center; justify-content:center; z-index:50; cursor:pointer;
    transition:transform .15s;
  }
  .fab:active{ transform:scale(.93); }
  .fab svg{ width:26px; height:26px; }

  /* Toast */
  .toast-wrap{ position:fixed; left:50%; bottom:calc(100px + var(--safe-bottom)); transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px; pointer-events:none; }
  .toast{
    background:rgba(15,23,42,.95); color:#fff; padding:13px 18px; border-radius:14px; font-size:.84rem; font-weight:600;
    border:1px solid rgba(255,255,255,.1); box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:9px; max-width:420px;
    opacity:0; transform:translateY(12px); transition:opacity .25s, transform .25s; backdrop-filter:blur(12px);
  }
  .toast.show{ opacity:1; transform:none; }
  .toast.success{ border-color:rgba(16,185,129,.3); } .toast.error{ border-color:rgba(244,63,94,.3); }
  .toast svg{ width:16px; height:16px; flex:none; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
    display:none; align-items:flex-end; justify-content:center; z-index:100; opacity:0; transition:opacity .22s;
  }
  .modal-overlay.open{ display:flex; }
  .modal-overlay.show{ opacity:1; }
  .modal-card{
    background:#0F172A; border:1px solid var(--border); border-radius:24px 24px 0 0; width:100%; max-width:480px;
    padding:22px 20px calc(22px + var(--safe-bottom)); transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.1); max-height:92vh; overflow-y:auto;
  }
  .modal-overlay.show .modal-card{ transform:translateY(0); }
  .modal-handle{ width:42px; height:5px; background:rgba(255,255,255,.15); border-radius:99px; margin:0 auto 16px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head h3{ font-size:1.12rem; font-weight:800; margin:0; }
  .modal-close{ border:none; background:rgba(255,255,255,.08); border-radius:11px; width:36px; height:36px; color:var(--ink-soft); cursor:pointer; font-size:1.1rem; }
  .modal-close:hover{ background:var(--danger-soft); color:#FB7185; }
  .form-group{ margin-bottom:14px; }
  .form-group label{ font-size:.76rem; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px; }
  .form-group input{
    width:100%; height:48px; border:1px solid var(--border); border-radius:13px; padding:10px 14px;
    font-size:.9rem; font-family:inherit; background:rgba(255,255,255,.04); color:var(--ink); transition:.2s;
  }
  .form-group input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .form-row-2{ display:grid; grid-template-columns:1fr 1.15fr; gap:12px; }
  .expected-presets{ display:flex; gap:7px; margin-top:8px; }
  .preset-btn{
    flex:1; height:34px; border:1px solid var(--border); background:rgba(255,255,255,.04);
    border-radius:9px; color:var(--ink-soft); font-size:.74rem; font-weight:700; cursor:pointer; transition:.15s;
  }
  .preset-btn:hover, .preset-btn.active{ border-color:var(--primary); color:var(--primary-2); background:var(--primary-soft); }
  .form-hint{ font-size:.72rem; color:var(--ink-faint); margin-top:-2px; margin-bottom:12px; }
  .modal-actions{ display:flex; gap:12px; margin-top:8px; }
  .btn-cancel, .btn-submit{ height:50px; border-radius:14px; font-weight:700; font-size:.88rem; cursor:pointer; transition:.2s; }
  .btn-cancel{ flex:1; border:1px solid var(--border); background:transparent; color:var(--ink-soft); }
  .btn-submit{ flex:1.4; border:none; background:linear-gradient(135deg,#6366F1,#A855F7); color:#fff; box-shadow:0 8px 20px rgba(99,102,241,.35); }
  .btn-submit:active{ transform:scale(.98); }

  @media (min-width:640px){
    .modal-overlay{ align-items:center; padding:20px; }
    .modal-card{ border-radius:22px; transform:translateY(24px) scale(.97); opacity:0; }
    .modal-overlay.show .modal-card{ transform:none; opacity:1; }
    .modal-handle{ display:none; }
    .fab{ display:none !important; }
  }
  @media (max-width:760px){ .summary-strip{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:640px){
    .container-app{ padding:0 14px; }
    .hero{ padding:18px 0 6px; }
    .brand-title{ font-size:1.25rem; }
    .controls{ margin-top:16px; }
    .select-wrap, .search-wrap{ width:100%; }
    .select-item, .search-input{ width:100%; max-width:100%; }
    .chip-row{ width:100%; overflow-x:auto; flex-wrap:nowrap; padding-bottom:4px; scrollbar-width:none; }
    .chip-row::-webkit-scrollbar{ display:none; }
    .chip{ flex:none; }
    .search-wrap{ margin-left:0; }
    .fab{ display:flex; }
  }
  @media (max-width:480px){
    .carton-row{ flex-wrap:wrap; row-gap:10px; padding:14px 16px; }
    .carton-label{ width:auto; order:1; }
    .status-pill{ order:2; margin-left:auto; }
    .carton-dates{ order:4; width:100%; gap:14px; }
    .diff-block{ order:3; text-align:left; width:auto; }
    .row-actions{ order:5; width:100%; justify-content:flex-end; margin-top:4px; }
    .form-row-2{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="container-app">
  <div class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">
            <span lang-zh>到货台账</span><span lang-en>Goods Arrival Tracker</span>
          </div>
          <div class="brand-sub" id="lastUpdated">
            <span class="dot"></span><span lang-zh>正在连接...</span><span lang-en>Connecting...</span>
          </div>
        </div>
      </div>
      <div class="hero-actions">

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzys068BWHWde1aWzkBKTU-egTbMTJImGMfo-XZ7EkXEu648K_y6GayVbv8kFXYCqAJ/exec";
const LS_KEY = 'goods_tracker_v2';
const LS_OVERRIDES = 'goods_tracker_overrides_v1';

let currentLang = 'zh';
let sheetEntries = [];
let manualEntries = [];
let overrides = {};          // key = item|carton → { actual: Date }
let allEntries = [];
let currentFilter = 'all';
let selectedExpectedPreset = null;

/* ---------- Utils ---------- */
function showToast(msg, type='success'){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = (type==='error'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>') + '<span>'+msg+'</span>';
  wrap.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 2600);
}

function keyOf(e){ return e.item + '|' + e.carton; }

function loadStorage(){
  try{
    manualEntries = JSON.parse(localStorage.getItem(LS_KEY) || '[]').map(e=>({
      ...e,
      order: e.order ? new Date(e.order) : null,
      expected: e.expected ? new Date(e.expected) : null,
      actual: e.actual ? new Date(e.actual) : null,
    }));
  }catch{ manualEntries = []; }
  try{
    const raw = JSON.parse(localStorage.getItem(LS_OVERRIDES) || '{}');
    overrides = {};
    Object.keys(raw).forEach(k=>{
      overrides[k] = { actual: raw[k].actual ? new Date(raw[k].actual) : null };
    });
  }catch{ overrides = {}; }
}
function saveManual(){
  localStorage.setItem(LS_KEY, JSON.stringify(manualEntries.map(e=>({
    ...e,
    order: e.order?.toISOString()||null,
    expected: e.expected?.toISOString()||null,
    actual: e.actual?.toISOString()||null,
  }))));
}
function saveOverrides(){
  const out = {};
  Object.keys(overrides).forEach(k=>{
    out[k] = { actual: overrides[k].actual?.toISOString()||null };
  });
  localStorage.setItem(LS_OVERRIDES, JSON.stringify(out));
}

function setLang(lang){
  currentLang = lang;
  document.body.classList.toggle('lang-en', lang==='en');
  document.getElementById('btn-zh').classList.toggle('active', lang==='zh');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('searchInput').placeholder = lang==='zh' ? '搜索...' : 'Search...';
  populateItemSelect();
  renderList();
}

/* ---------- Date helpers ---------- */
function parseDate(str){
  if(!str) return null;
  str = String(str).trim();
  let m = str.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = str.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(str);
  return isNaN(d) ? null : d;
}
function fmtDate(d){
  if(!d) return '—';
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtDateInput(d){
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function diffStatus(expected, actual){
  if(!expected || !actual) return { diff:null, status:'pending' };
  const diff = Math.round((actual - expected) / 86400000);
  return { diff, status: diff>0 ? 'late' : diff<0 ? 'early' : 'ontime' };
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){ field+='"'; i++; }
      else if(c==='"') inQ=false;
      else field+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()));
}
function findCol(headers, keys){
  for(let i=0;i<headers.length;i++){
    const h=headers[i].toLowerCase();
    if(keys.some(k=>h.includes(k))) return i;
  }
  return -1;
}
function buildSheetEntries(matrix){
  const headers = matrix[0].map(h=>h.trim());
  let itemIdx = findCol(headers,['品名','物品','名称','item','name','product']);
  let cartonIdx = findCol(headers,['箱','批次','carton','batch']);
  let orderIdx = findCol(headers,['下单','订购','order']);
  let expIdx = findCol(headers,['预计','expected']);
  let actIdx = findCol(headers,['实际','actual']);
  if(itemIdx===-1) itemIdx=0;
  if(expIdx===-1) expIdx = cartonIdx===-1?1:2;
  if(actIdx===-1) actIdx = cartonIdx===-1?2:3;

  const out=[]; let auto={};
  for(let i=1;i<matrix.length;i++){
    const r=matrix[i];
    const item=(r[itemIdx]||'').trim();
    if(!item) continue;
    let carton = cartonIdx!==-1 ? (r[cartonIdx]||'').trim() : '';
    if(!carton){ auto[item]=(auto[item]||0)+1; carton='#'+auto[item]; }
    const order = orderIdx!==-1 ? parseDate(r[orderIdx]) : null;
    const expected = parseDate(r[expIdx]);
    let actual = parseDate(r[actIdx]);

    // apply local override
    const k = item+'|'+carton;
    if(overrides[k] && overrides[k].actual) actual = overrides[k].actual;

    const {diff,status} = diffStatus(expected, actual);
    out.push({ item, carton, order, expected, actual, diff, status, source:'sheet', id:k });
  }
  return out;
}

function recombine(){
  // apply overrides to manual too
  manualEntries = manualEntries.map(e=>{
    const k = keyOf(e);
    if(overrides[k]?.actual){
      const actual = overrides[k].actual;
      const {diff,status} = diffStatus(e.expected, actual);
      return {...e, actual, diff, status};
    }
    return e;
  });
  allEntries = sheetEntries.concat(manualEntries);
}

/* ---------- Mark Received ---------- */
function markReceived(id){
  const today = new Date();
  today.setHours(0,0,0,0);

  // find entry
  let entry = allEntries.find(e => (e.id||keyOf(e)) === id);
  if(!entry) return;

  overrides[id] = { actual: today };
  saveOverrides();

  // also update in memory
  entry.actual = today;
  const {diff,status} = diffStatus(entry.expected, today);
  entry.diff = diff;
  entry.status = status;

  recombine();
  renderAll();
  showToast(currentLang==='zh' ? '已标记为已收货' : 'Marked as received', 'success');
}

/* ---------- Load ---------- */
async function loadFromSheet(){
  renderLoading();
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try{
    const sep = SHEET_URL.includes('?')?'&':'?';
    const res = await fetch(SHEET_URL + sep + 't=' + Date.now());
    if(!res.ok) throw {kind:'http',status:res.status};
    const text = await res.text();
    if(text.trim().startsWith('<')) throw {kind:'not-csv'};

    const matrix = parseCSV(text);
    sheetEntries = matrix.length>=2 ? buildSheetEntries(matrix) : [];
    recombine();
    document.getElementById('lastUpdated').innerHTML =
      '<span class="dot"></span>' + (currentLang==='zh'?'最后更新：':'Updated: ') + new Date().toLocaleString();
    populateItemSelect();
    renderAll();
    showToast(currentLang==='zh'?'同步成功':'Sync successful');
  }catch(err){
    const zh=currentLang==='zh';
    let msg = zh?'无法读取数据':'Could not read data';
    if(err?.kind==='not-csv') msg = zh?'返回内容不是CSV，请检查部署权限':'Response is not CSV, check deployment permissions';
    renderError(msg);
    showToast(zh?'同步失败':'Sync failed','error');
  }finally{
    btn.classList.remove('spinning');
  }
}

/* ---------- Manual Add ---------- */
function openModal(){
  const ov=document.getElementById('modalOverlay');
  ov.classList.add('open');
  requestAnimationFrame(()=>ov.classList.add('show'));
  setTimeout(()=>document.getElementById('f-item').focus(),300);
}
function closeModal(){
  const ov=document.getElementById('modalOverlay');
  ov.classList.remove('show');
  setTimeout(()=>{
    ov.classList.remove('open');
    document.getElementById('addForm').reset();
    selectedExpectedPreset=null;
    document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  },250);
}
function setExpectedPreset(days){
  const orderRaw=document.getElementById('f-order').value;
  if(!orderRaw){ showToast(currentLang==='zh'?'请先填下单日期':'Please enter the order date first','error'); return; }
  selectedExpectedPreset=days;
  const order=new Date(orderRaw+'T00:00:00');
  const exp=new Date(order); exp.setDate(exp.getDate()+days);
  document.getElementById('f-expected').value=fmtDateInput(exp);
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active',+b.dataset.days===days));
}
function recalcExpectedFromPreset(){
  if(!selectedExpectedPreset) return;
  const orderRaw=document.getElementById('f-order').value;
  if(!orderRaw) return;
  const order=new Date(orderRaw+'T00:00:00');
  const exp=new Date(order); exp.setDate(exp.getDate()+selectedExpectedPreset);
  document.getElementById('f-expected').value=fmtDateInput(exp);
}
function submitManualEntry(ev){
  ev.preventDefault();
  const item=document.getElementById('f-item').value.trim();
  let carton=document.getElementById('f-carton').value.trim();
  const orderRaw=document.getElementById('f-order').value;
  const expRaw=document.getElementById('f-expected').value;
  const actRaw=document.getElementById('f-actual').value;
  if(!item||!expRaw) return false;

  const order=orderRaw?new Date(orderRaw+'T00:00:00'):null;
  const expected=new Date(expRaw+'T00:00:00');
  const actual=actRaw?new Date(actRaw+'T00:00:00'):null;
  if(!carton){
    const cnt=allEntries.filter(e=>e.item===item).length;
    carton='#'+(cnt+1);
  }
  const {diff,status}=diffStatus(expected,actual);
  const id = item+'|'+carton;
  manualEntries.push({ id, item, carton, order, expected, actual, diff, status, source:'manual' });
  saveManual();
  recombine();
  populateItemSelect();
  renderAll();
  closeModal();
  showToast(currentLang==='zh'?'已添加':'Added');
  return false;
}
function deleteManualEntry(id){
  if(!confirm(currentLang==='zh'?'确定删除？':'Delete this record?')) return;
  manualEntries=manualEntries.filter(e=>e.id!==id);
  delete overrides[id];
  saveManual(); saveOverrides();
  recombine();
  populateItemSelect();
  renderAll();
  showToast(currentLang==='zh'?'已删除':'Deleted');
}

/* ---------- Render ---------- */
function renderLoading(){
  document.getElementById('listArea').innerHTML=`
    <div class="futuristic-loader">
      <div class="loader-core">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-center"></div>
      </div>
      <div class="loader-text">${currentLang==='zh'?'正在同步数据...':'Syncing data...'}</div>
    </div>`;
}
function renderError(msg){
  document.getElementById('listArea').innerHTML=`
    <div class="error-state"><div class="glyph">⚠️</div><div>${msg}</div></div>`;
}

function populateItemSelect(){
  const sel=document.getElementById('itemSelect');
  const items=[...new Set(allEntries.map(e=>e.item))];
  const zh=currentLang==='zh';
  const cur=sel.value;
  sel.innerHTML=`<option value="__all__">${zh?'全部物品':'All items'}</option>`+
    items.map(it=>`<option value="${escapeAttr(it)}">${escapeHtml(it)}</option>`).join('');
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
}
function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.f===f));
  renderList();
}

function animateValue(el,from,to,suffix=''){
  const start=performance.now();
  function step(now){
    const p=Math.min((now-start)/480,1);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*eased)+suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function computeStats(entries){
  const total=entries.length;
  const withData=entries.filter(e=>e.diff!==null);
  const late=withData.filter(e=>e.status==='late').length;
  const ontimeCount=withData.filter(e=>e.status!=='late').length;
  const pending=entries.filter(e=>e.diff===null).length;
  const pct=withData.length?Math.round(ontimeCount/withData.length*100):0;

  const elT=document.getElementById('st-total');
  const elL=document.getElementById('st-late');
  const elP=document.getElementById('st-pending');
  const elO=document.getElementById('st-ontime');

  animateValue(elT,+elT.dataset.v||0,total);
  animateValue(elL,+elL.dataset.v||0,late);
  animateValue(elP,+elP.dataset.v||0,pending);
  if(withData.length) animateValue(elO,+elO.dataset.v||0,pct,'%');
  else elO.textContent='–';
  elT.dataset.v=total; elL.dataset.v=late; elP.dataset.v=pending; elO.dataset.v=pct;
  document.getElementById('ringChart').style.setProperty('--pct',pct);
}

function renderAll(){ computeStats(allEntries); renderList(); }

function renderList(){
  const zh=currentLang==='zh';
  const selected=document.getElementById('itemSelect').value;
  const search=(document.getElementById('searchInput').value||'').toLowerCase();

  let entries=allEntries.filter(e=>{
    if(selected!=='__all__'&&e.item!==selected) return false;
    if(currentFilter!=='all'&&e.status!==currentFilter) return false;
    if(search&&!e.item.toLowerCase().includes(search)&&!e.carton.toLowerCase().includes(search)) return false;
    return true;
  });

  computeStats(selected==='__all__'?allEntries:allEntries.filter(e=>e.item===selected));

  const list=document.getElementById('listArea');
  if(!allEntries.length){
    list.innerHTML=`<div class="empty-state">
      <div class="glyph">📦</div>
      <div><span lang-zh>还没有数据，点击右下角按钮添加</span><span lang-en>No data yet — tap the button in the corner to add one</span></div>
      <div class="cta-row"><button class="btn-submit" style="flex:none;padding:0 24px;height:46px" onclick="openModal()">
        <span lang-zh>添加记录</span><span lang-en>Add Record</span></button></div>
    </div>`;
    return;
  }
  if(!entries.length){
    list.innerHTML=`<div class="empty-state"><div class="glyph">🗂️</div><div>${zh?'没有符合条件的记录':'No matching records'}</div></div>`;
    return;
  }

  const statusLabel={late:zh?'延误':'Late',early:zh?'提前':'Early',ontime:zh?'准时':'On time',pending:zh?'待收货':'Pending'};
  const statusIcon={
    late:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v9"/><path d="M12 19h.01"/></svg>',
    early:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
    ontime:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>',
    pending:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
  };

  const groups={};
  entries.forEach(e=>{ (groups[e.item]=groups[e.item]||[]).push(e); });

  let html='', gi=0;
  Object.keys(groups).forEach(name=>{
    const rows=groups[name];
    const lateCnt=rows.filter(r=>r.status==='late').length;
    const initial=name.trim().slice(0,1).toUpperCase();
    gi++;
    html+=`<div class="item-group" style="animation-delay:${Math.min(gi*40,240)}ms">
      <div class="item-group-head">
        <div class="left">
          <div class="item-badge">${escapeHtml(initial)}</div>
          <div>
            <div class="name">${escapeHtml(name)}</div>
            <div class="meta">${rows.length} ${zh?'箱':'cartons'}${lateCnt?` · <span class="warn">${lateCnt} ${zh?'延误':'late'}</span>`:''}</div>
          </div>
        </div>
        <span class="badge-count">${rows.length}</span>
      </div>`;

    rows.forEach(r=>{
      const diffClass=r.diff===null?'pending':r.diff>0?'late':r.diff<0?'early':'ontime';
      const diffText=r.diff===null?'—':(r.diff>0?'+'+r.diff:r.diff);
      const id=r.id||keyOf(r);
      const isManual=r.source==='manual';

      html+=`<div class="carton-row">
        <div class="carton-label">${isManual?'<span class="manual-dot"></span>':''}${escapeHtml(r.carton)}</div>
        <div class="carton-dates">
          <div class="date-block"><div class="k">${zh?'下单':'Order'}</div><div class="v">${fmtDate(r.order)}</div></div>
          <div class="date-block"><div class="k">${zh?'预计':'Expected'}</div><div class="v">${fmtDate(r.expected)}</div></div>
          <div class="date-block"><div class="k">${zh?'实际':'Actual'}</div><div class="v">${fmtDate(r.actual)}</div></div>
        </div>
        <div class="diff-block ${diffClass}">${diffText}</div>
        <div class="status-pill ${r.status}">${statusIcon[r.status]}${statusLabel[r.status]}</div>
        <div class="row-actions">
          ${r.status==='pending'
            ? `<button class="btn-receive" onclick="markReceived('${id}')">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                 <span lang-zh>已收货</span><span lang-en>Received</span>
               </button>`
            : ''}
          ${isManual
            ? `<button class="row-delete" onclick="deleteManualEntry('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>`
            : ''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  list.innerHTML=html;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* Boot */
window.addEventListener('DOMContentLoaded',()=>{
  loadStorage();
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
  document.getElementById('f-expected').addEventListener('change',()=>{
    selectedExpectedPreset=null;
    document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  });
  loadFromSheet();
});
</script>
</body>
